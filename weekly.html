<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Run Quota</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> NS33 Quota</div>
    <a class="back-link" href="index.html">← Home</a>
  </header>

  <main class="page">
    <div class="page-header">
      <div class="page-eyebrow">02 — Submit</div>
      <h1 class="page-title">Weekly Run Quota</h1>
      <p class="page-desc">
        Log your total run distance for the week. This is tracked separately from
        the daily quota log — no need to specify what kind of running you did.
      </p>
    </div>

    <form id="weekly-form" class="panel">
      <div class="field">
        <label for="bunk">Bunk Number</label>
        <select id="bunk" required>
          <option value="" disabled selected>Select bunk</option>
          <option value="36">36</option>
          <option value="37">37</option>
          <option value="38">38</option>
          <option value="39">39</option>
        </select>
      </div>

      <div class="field">
        <label for="name">Name</label>
        <select id="name" required disabled>
          <option value="" disabled selected>Select bunk first</option>
        </select>
      </div>

      <div class="field">
        <label for="distance">Total Run Distance (km)</label>
        <input type="text" id="distance" placeholder="e.g. 12" required autocomplete="off" />
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">Submit Entry</button>

      <div id="status-msg" class="status-msg"></div>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="roster.js"></script>
  <script src="weekly.js"></script>
</body>
</html>
